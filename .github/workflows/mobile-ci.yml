name: Mobile CI (fibemate-react-native / RN CLI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-test:
    name: Lint + Type-check + Test (RN CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint, advisory - non-blocking)
        # Lint is a HARD gate. .eslintrc.js extends @react-native/eslint-config
        # which requires eslint-plugin-react; that plugin is now in devDependencies
        # (pinned to RN 0.86). npm ci installs it, so lint must pass.
        run: npm run lint

      - name: Type-check (tsc --noEmit, HARD gate)
        # App.tsx now compares the hybrid shared secret with a constant-time
        # Uint8Array compare (no Node `Buffer`, no @types/node needed), so tsc
        # passes on a clean machine. Lint + type-check + test are all hard gates.
        run: npx tsc --noEmit

      - name: Verify Jest discovers the expected test suite (HARD gate)
        # Keep this floor in one place; update it intentionally when the suite changes.
        run: |
          test_files="$(npx jest --listTests)"
          test_count="$(printf '%s\n' "$test_files" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "$test_count" -lt 2 ]; then
            echo "::error::Jest collected $test_count test file(s); expected at least 2. Check testMatch and testPathIgnorePatterns."
            exit 1
          fi
          echo "Jest collected $test_count test files."

      - name: Unit tests (jest, HARD gate)
        # Do not use --passWithNoTests in CI: an empty test suite must fail.
        run: npm test -- --ci
